
<!DOCTYPE html>
<html>
<head>
<style>
body { background: #2D080E; display: flex; gap: 20px; padding: 40px; }
.btn {
  width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  background: radial-gradient(circle at 35% 30%, #FFECA8 0%, #D4AF37 55%, #996515 100%);
  border: 1.5px solid rgba(255, 242, 178, 0.85); color: #3A050E;
  box-shadow: 0 4px 18px rgba(0,0,0,0.6), 0 0 14px rgba(212,175,55,0.45);
}
</style>
</head>
<body>
<div style='display:flex; flex-direction:column; align-items:center; gap:8px;'>
  <div class='btn'>
    <!-- Music icon (Reference) -->
    <svg viewBox='0 0 24 24' width='22' height='22' fill='currentColor'>
      <path d='M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z' />
    </svg>
  </div>
  <span style='color:#FFECA8; font-family:sans-serif; font-size:11px;'>Music</span>
</div>

<div style='display:flex; flex-direction:column; align-items:center; gap:8px;'>
  <div class='btn'>
    <!-- Implemented Extra Thick & Defined Replay Icon -->
    <svg viewBox='0 0 24 24' width='22' height='22' fill='currentColor'>
      <path d='M12 4.5V0.5L4.5 6.5l7.5 6V8.5c2.49 0 4.5 2.01 4.5 4.5s-2.01 4.5-4.5 4.5-4.5-2.01-4.5-4.5H3.5c0 4.7 3.8 8.5 8.5 8.5s8.5-3.8 8.5-8.5-3.8-8.5-8.5-8.5z'/>
    </svg>
  </div>
  <span style='color:#FFECA8; font-family:sans-serif; font-size:11px;'>New Replay (Thick)</span>
</div>

<div style='display:flex; flex-direction:column; align-items:center; gap:8px;'>
  <div class='btn' style='opacity:0.6;'>
    <!-- Original Thin Replay Icon (For comparison) -->
    <svg viewBox='0 0 24 24' width='22' height='22' fill='currentColor'>
      <path d='M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z'/>
    </svg>
  </div>
  <span style='color:rgba(255,236,168,0.6); font-family:sans-serif; font-size:11px;'>Old Replay (Thin)</span>
</div>
</body>
</html>
